<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<meta name="color-scheme" content="dark">
<title>Gửi tặng Quỳnh</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="preload" as="script" href="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#05070f;color-scheme:dark;touch-action:none}
body{background:radial-gradient(ellipse at 50% 40%,#0b1226 0%,#05070f 70%)}
canvas{display:block;width:100%;height:100%;touch-action:none}
#stage{position:fixed;inset:0}
#veil{position:fixed;inset:-2px;z-index:10;background:radial-gradient(ellipse at 50% 40%,#0b1226 0%,#05070f 70%);opacity:1;transition:opacity 1.2s ease;pointer-events:none}
#veil.off{opacity:0}
#hint{position:fixed;left:0;right:0;bottom:max(24px,env(safe-area-inset-bottom,0px));text-align:center;font:500 .85rem system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#8fb1c4;opacity:0;transition:opacity 1.2s;pointer-events:none;z-index:5}
#hint.show{opacity:.85}
#fallback{position:fixed;inset:0;display:none;place-items:center;font:600 1.1rem system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#ffb3cf;text-shadow:0 0 14px rgba(255,45,115,.8);z-index:4}
</style>
</head>
<body>
<div id="stage"></div>
<div id="fallback">Ha ở đây với quỳnh nè 💝</div>
<div id="veil"></div>
<audio id="bgm" loop preload="auto"></audio>

<script>
/* ===== CẤU HÌNH — chỉ sửa ở đây ===== */
const CONFIG = {
  /* lời chúc bay trong cảnh chữ rơi */
  words: ["yeuuu quynhhh vchhhh", "20/10 vuive nheee", "chuc q luon xinhdep", "miss q lamm lunn", "q xinh nhat luon", "cuoi nhieu len nheee", "iu q nhiuuu", "hom nay q la nhat", "vui ve hanhphuc nheee", "ngoan ngoan xinh xinh", "t luon o day nheee", "q cute vchhh"],
  /* NHẠC: bài "chờ anh chút thôi" (file cho-anh.mp3 cùng thư mục), phát từ đầu bài */
  music: "cho-anh.mp3"
};
/* ===================================== */
const $ = (s) => document.querySelector(s);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/* ---- nhạc: bài riêng của trang chữ rơi ---- */
const bgm = $("#bgm"); bgm.src = CONFIG.music; bgm.volume = 0.85;
let wantPlay = true;
try { wantPlay = sessionStorage.getItem("haMusicP") !== "0"; } catch (e) {}   /* ở trang Ha đã tắt nhạc thì giữ nguyên tắt */
bgm.addEventListener("loadedmetadata", tryPlay);
function tryPlay() { if (!wantPlay || !bgm.paused) return; const p = bgm.play(); if (p && p.catch) p.catch(() => {}); }
tryPlay();
["pointerdown", "touchend", "click", "keydown"].forEach((ev) => addEventListener(ev, tryPlay, { passive: true }));   /* trình duyệt chặn tự phát -> chạm lần đầu là nhạc lên */

/* ---- tải Three.js ---- */
function add(src) { return new Promise((res, rej) => { const el = document.createElement("script"); el.src = src; el.async = false; el.onload = res; el.onerror = rej; document.head.appendChild(el); }); }
function loadThree() { return Promise.all([add("https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"), add("https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js")]); }   /* tải song song, chạy đúng thứ tự (async=false) */

function run3d() {
  const host = $("#stage"), mobile = matchMedia("(pointer: coarse)").matches || innerWidth < 700, K = mobile ? 0.5 : 1;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 2000);
  const FROM = new THREE.Vector3(260, -40, 380), TO = new THREE.Vector3(75, -12, 105);
  camera.position.copy(FROM); camera.lookAt(0, 0, 0);
  const renderer = new THREE.WebGLRenderer({ antialias: !mobile, alpha: true });
  renderer.setClearColor(0x000000, 0); renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio || 1, mobile ? 1.5 : 2));
  host.appendChild(renderer.domElement);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0, 0); controls.enableDamping = true; controls.dampingFactor = 0.05; controls.maxDistance = 550; controls.minDistance = 20; controls.enabled = false;

  function wordTex(word) {
    const c = document.createElement("canvas"); c.width = 512; c.height = 128; const x = c.getContext("2d");
    let fs = 54; x.font = "500 " + fs + "px system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"; x.textAlign = "center"; x.textBaseline = "middle";
    while (fs > 28 && x.measureText(word).width > 440) { fs -= 2; x.font = x.font.replace(/\d+px/, fs + "px"); }   /* chữ dài tự thu nhỏ cho vừa khung */
    const cx = 256, cy = 64;
    x.shadowColor = "rgba(255, 20, 95, 0.95)"; x.shadowBlur = 26; x.fillStyle = "rgba(255, 45, 115, 0.9)"; x.fillText(word, cx, cy);
    x.shadowColor = "rgba(255, 35, 110, 1)"; x.shadowBlur = 12; x.fillStyle = "rgba(255, 155, 195, 0.95)"; x.fillText(word, cx, cy);
    x.shadowBlur = 0; x.fillStyle = "#fff3f8"; x.fillText(word, cx, cy);
    const t = new THREE.CanvasTexture(c); t.minFilter = THREE.LinearFilter; t.magFilter = THREE.LinearFilter; return t;
  }
  const wordMats = CONFIG.words.map((w) => new THREE.MeshBasicMaterial({ map: wordTex(w), transparent: true, side: THREE.DoubleSide, depthWrite: false }));
  function heartTex() {
    const c = document.createElement("canvas"); c.width = c.height = 128; const x = c.getContext("2d");
    x.beginPath(); x.moveTo(64, 42); x.bezierCurveTo(64, 36, 54, 20, 34, 20); x.bezierCurveTo(10, 20, 10, 52, 10, 52); x.bezierCurveTo(10, 74, 34, 96, 64, 114);
    x.bezierCurveTo(94, 96, 118, 74, 118, 52); x.bezierCurveTo(118, 52, 118, 20, 94, 20); x.bezierCurveTo(74, 20, 64, 36, 64, 42); x.closePath();
    x.shadowColor = "rgba(255, 30, 15, 0.9)"; x.shadowBlur = 14; x.fillStyle = "#ff2612"; x.fill(); return new THREE.CanvasTexture(c);
  }
  function starTex() {
    const c = document.createElement("canvas"); c.width = c.height = 32; const x = c.getContext("2d"), g = x.createRadialGradient(16, 16, 0, 16, 16, 16);
    g.addColorStop(0, "rgba(255,255,255,1)"); g.addColorStop(0.4, "rgba(255,245,250,0.95)"); g.addColorStop(0.7, "rgba(255,200,225,0.35)"); g.addColorStop(1, "rgba(255,255,255,0)");
    x.fillStyle = g; x.fillRect(0, 0, 32, 32); return new THREE.CanvasTexture(c);
  }
  const heartT = heartTex(), starT = starTex();
  const items = [], RX = 520, RY = 420, RZ = 480;
  const put = (mesh, s0, s1) => { mesh.position.set((Math.random() - 0.5) * RX, (Math.random() - 0.5) * RY, (Math.random() - 0.5) * RZ); const k = s0 + Math.random() * s1; mesh.scale.set(k, k, 1); scene.add(mesh); };
  const planeGeo = new THREE.PlaneGeometry(42, 10.5), nW = Math.round(380 * K);
  for (let i = 0; i < nW; i++) { const m = new THREE.Mesh(planeGeo, wordMats[i % wordMats.length]); put(m, 0.65, 0.95); items.push({ mesh: m, speed: 0.25 + Math.random() * 0.35 }); }
  const heartMat = new THREE.MeshBasicMaterial({ map: heartT, transparent: true, side: THREE.DoubleSide, depthWrite: false }), heartGeo = new THREE.PlaneGeometry(9.5, 9.5), nH = Math.round(130 * K);
  for (let i = 0; i < nH; i++) { const m = new THREE.Mesh(heartGeo, heartMat); put(m, 0.65, 1.15); items.push({ mesh: m, speed: 0.3 + Math.random() * 0.45 }); }
  function layer(count, spread, size, op, att) {
    count = Math.round(count * K); const geo = new THREE.BufferGeometry(), pos = new Float32Array(count * 3);
    for (let i = 0; i < count * 3; i++) pos[i] = (Math.random() - 0.5) * spread;
    geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    const p = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xffffff, map: starT, size: size, sizeAttenuation: att, transparent: true, opacity: op, depthWrite: false, blending: THREE.AdditiveBlending }));
    scene.add(p); return p;
  }
  const dust = layer(10000, 1100, 1.5, 0.8, false), deep = layer(7000, 900, 2.2, 0.85, true), mid = layer(3500, 620, 2.8, 0.95, true), near = layer(1500, 420, 3.5, 1.0, true);

  const clock = new THREE.Clock(); let t0 = 0, flying = true, raf = 0;
  function frame3() {
    raf = requestAnimationFrame(frame3);
    const el = clock.getElapsedTime();
    for (let i = 0; i < wordMats.length; i++) { const mx = (Math.sin(el * 1.5 + i * Math.PI / 5) + 1) / 2; wordMats[i].color.setRGB(1, 1 - mx * 0.32, 1 - mx * 0.18); }
    const hy = RY / 2;
    for (let i = 0; i < items.length; i++) { const it = items[i]; it.mesh.position.y -= it.speed; if (it.mesh.position.y < -hy) { it.mesh.position.y = hy; it.mesh.position.x = (Math.random() - 0.5) * RX; it.mesh.position.z = (Math.random() - 0.5) * RZ; } }
    dust.rotation.y = -el * 0.004; deep.rotation.y = el * 0.006; mid.rotation.y = -el * 0.01; near.rotation.x = el * 0.008;
    if (flying) {
      const k = Math.min(1, (performance.now() - t0) / 3600), e = 1 - Math.pow(1 - k, 3);
      camera.position.lerpVectors(FROM, TO, e); camera.lookAt(0, 0, 0);
      if (k >= 1) { flying = false; controls.enabled = true; controls.update(); }
    } else controls.update();
    renderer.render(scene, camera);
  }
  addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
  document.addEventListener("visibilitychange", () => { if (document.hidden) { cancelAnimationFrame(raf); raf = 0; } else if (!raf) { clock.getDelta(); frame3(); } });
  /* bắt đầu bay camera đúng lúc màn đêm mở ra */
  return () => { t0 = performance.now(); frame3(); };
}

(async function main() {
  let begin = null, ok = true;
  try {
    await Promise.race([loadThree(), sleep(12000).then(() => { throw 0; })]);
    if (!(window.THREE && THREE.OrbitControls)) throw 0;
    begin = run3d();
  } catch (e) { ok = false; }
  if (ok) begin(); else $("#fallback").style.display = "grid";
  requestAnimationFrame(() => $("#veil").classList.add("off"));
})();
</script>
</body>
</html>
