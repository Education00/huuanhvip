<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd9e6">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ha thức dậy</title>
<style>
:root{
  --ink:#5a1633; --ink2:#9b5a74; --rose:#e8456b; --bad:#c0143c;
  --k:54px;
  --spring:cubic-bezier(.34,1.56,.64,1);   /* nảy nhẹ kiểu iOS */
  --smooth:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:#ffd9e6}
html,body{height:100%}
body{
  font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 700px at 20% 10%,#ffe3ee 0,transparent 60%),
             radial-gradient(900px 600px at 90% 90%,#ffc7da 0,transparent 55%),#ffd9e6;
  display:grid;place-items:center;overflow:hidden;
  padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
}
#rain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;will-change:transform;transform:translateZ(0)}

#tapfx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}

/* ---------- Màn mở đầu: tải trái tim ---------- */
.intro{position:fixed;inset:0;z-index:20;display:grid;place-items:center;
  background:radial-gradient(900px 600px at 50% 40%,#ffe9f1,#ffd0e0 70%);
  transition:opacity .7s var(--smooth) .1s}
.intro .wrap{position:relative;width:112px;height:112px;display:grid;place-items:center;
  transition:transform .6s var(--smooth),opacity .5s ease}
.intro svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.intro .ring circle{fill:none;stroke-width:2.5;stroke-linecap:round}
.intro .ring .bg{stroke:rgba(232,69,107,.18)}
.intro .ring .fg{stroke:var(--rose);stroke-dasharray:289;stroke-dashoffset:289;animation:fill 1s cubic-bezier(.45,.05,.3,1) forwards}
@keyframes fill{to{stroke-dashoffset:0}}
.intro .heart{width:54px;height:54px;fill:var(--rose);filter:drop-shadow(0 6px 14px rgba(232,69,107,.45));
  animation:beat 1s ease-in-out infinite;transform-origin:center}
@keyframes beat{0%,100%{transform:scale(1)}18%{transform:scale(1.16)}34%{transform:scale(1)}50%{transform:scale(1.1)}66%{transform:scale(1)}}
.intro.leave{opacity:0;pointer-events:none}
.intro.leave .wrap{transform:scale(.55);opacity:0}

/* ---------- Khung chính ---------- */
.card{
  position:relative;z-index:1;width:min(860px,100%);min-height:min(520px,92vh);
  display:grid;grid-template-columns:1fr 1fr;border-radius:26px;overflow:hidden;
  background:linear-gradient(135deg,rgba(255,232,242,.97),rgba(255,214,230,.95));will-change:transform;
  box-shadow:0 30px 80px rgba(190,60,110,.28),0 2px 0 rgba(255,255,255,.7) inset;
}
.js-intro .card{opacity:0;transform:scale(.93) translateY(14px)}
.js-intro .card.in{opacity:1;transform:none;transition:opacity .5s ease,transform .8s var(--spring)}
/* các phần tử trồi lên lần lượt */
.js-intro .rv{opacity:0}
.card.in .rv{animation:rise .7s var(--spring) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}

.pic{
  position:relative;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:26px;
  background:linear-gradient(180deg,rgba(60,10,30,0) 40%,rgba(60,10,30,.72)),
             radial-gradient(circle at 30% 25%,#ffb8cf,#e0708f 60%,#a84465);
  background-size:cover;background-position:center;
}
.pic.has{background-image:linear-gradient(180deg,rgba(60,10,30,0) 45%,rgba(60,10,30,.75)),var(--img)}
.pic .big{position:absolute;inset:0;display:grid;place-items:center;font-size:120px;opacity:.28;filter:blur(1px)}
.pic.has .big{display:none}
.pic small{letter-spacing:.28em;font-size:.72rem;opacity:.9}
.pic h2{font-size:1.9rem;margin:6px 0 4px;color:#ff9db8;text-shadow:0 2px 12px rgba(80,0,30,.4);font-weight:700}
.pic h2 i{font-style:normal;color:#ff2d55}
.pic p{font-size:.78rem;opacity:.92}

.pad{padding:30px 34px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.logo{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.55);display:grid;place-items:center;font-size:26px;box-shadow:0 6px 18px rgba(232,69,107,.25)}
.pad h1{font-size:1.5rem;margin:14px 0 6px}
.pad .sub{font-size:.78rem;color:var(--ink2);line-height:1.5;max-width:230px}

/* chấm mật mã: không còn ô nền */
.dots{display:flex;gap:22px;justify-content:center;align-items:center;margin:22px 0 12px;height:30px}
.dots i{position:relative;display:block;width:14px;height:14px;border-radius:50%;
  border:2px solid rgba(232,69,107,.55);background:transparent;will-change:transform;
  transition:background-color .12s,border-color .12s,box-shadow .12s}
.dots i.on{background:var(--rose);border-color:var(--rose);box-shadow:0 2px 10px rgba(232,69,107,.5)}
.dots i b{position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--rose);opacity:0;pointer-events:none}
.dots.bad i{border-color:var(--bad)}
.dots.bad i.on{background:var(--bad);box-shadow:0 2px 10px rgba(192,20,60,.45)}
.msg{height:1.1em;font-size:.76rem;color:var(--bad);margin-bottom:10px;opacity:0;transform:translateY(-4px);transition:opacity .2s,transform .3s var(--spring)}
.msg.show{opacity:1;transform:none}

/* phím tròn, nảy kiểu iOS */
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:11px 0;width:min(250px,100%);justify-items:center}
.keys button{
  font:600 1.1rem inherit;font-family:inherit;color:var(--ink);width:var(--k);height:var(--k);border-radius:50%;
  background:rgba(255,255,255,.35);border:1.5px solid rgba(232,69,107,.45);cursor:pointer;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  will-change:transform;
  transition:transform .55s var(--spring),background-color .45s ease,border-color .45s ease,box-shadow .45s ease;
}
.keys button.p{transform:scale(.9);background:rgba(255,255,255,.92);border-color:var(--rose);
  box-shadow:0 0 0 6px rgba(232,69,107,.14);transition:transform .09s ease-out,background-color .06s,border-color .06s,box-shadow .09s}
@media (hover:hover){.keys button:hover{background:rgba(255,255,255,.6);border-color:var(--rose)}}
.keys .ghost{color:var(--ink2);font-weight:500;font-size:.92rem}
.keys .sp{width:var(--k);height:var(--k);visibility:hidden}
.keys button:focus-visible{outline:2px solid var(--rose);outline-offset:2px}

/* gợi ý */
.hintbtn{margin-top:14px;font:600 .86rem inherit;font-family:inherit;color:var(--rose);background:rgba(255,255,255,.55);
  border:1.5px solid rgba(232,69,107,.45);border-radius:999px;padding:9px 20px;cursor:pointer;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;will-change:transform;
  transition:transform .55s var(--spring),background-color .4s,border-color .4s,box-shadow .4s}
.hintbtn.p{transform:scale(.92);background:rgba(255,255,255,.95);border-color:var(--rose);box-shadow:0 0 0 6px rgba(232,69,107,.14);transition:transform .09s ease-out,background-color .06s,box-shadow .09s}
.hintbtn:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.hintbtn.nudge{animation:nudge 1.1s var(--spring) 2}
@keyframes nudge{0%,100%{transform:scale(1)}30%{transform:scale(1.12)}60%{transform:scale(.97)}}
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:24px;background:rgba(90,22,51,.32);
  opacity:0;pointer-events:none;transition:opacity .3s ease}
.modal.show{opacity:1;pointer-events:auto}
.sheet{width:min(320px,100%);padding:26px 22px 18px;border-radius:26px;text-align:center;
  background:linear-gradient(160deg,#fff7fa,#ffe3ee);box-shadow:0 30px 70px rgba(120,20,60,.35),0 2px 0 rgba(255,255,255,.8) inset;
  transform:scale(.8) translateY(14px);opacity:0;transition:transform .55s var(--spring),opacity .25s ease}
.modal.show .sheet{transform:none;opacity:1}
.sheet .bulb{font-size:2.4rem;line-height:1}
.sheet h3{margin:8px 0 8px;font-size:1.15rem;color:var(--ink)}
.sheet p{font-size:1rem;line-height:1.55;color:var(--ink);margin-bottom:18px}
.sheet button{font:600 .95rem inherit;font-family:inherit;color:#fff;background:var(--rose);border:0;border-radius:999px;padding:12px 30px;cursor:pointer;
  touch-action:manipulation;will-change:transform;box-shadow:0 8px 20px rgba(232,69,107,.35);transition:transform .55s var(--spring)}
.sheet button.p{transform:scale(.93);transition:transform .09s ease-out}

/* mở khóa: trái tim nở ra phủ màn hình rồi chìm vào đêm của trang Ha */
.bloom{position:fixed;inset:0;z-index:30;pointer-events:none;visibility:hidden}
.bloom.go{visibility:visible;pointer-events:auto}
.bloom .pk{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#fff3f8,#ffc9dc 58%,#ff9ec0);clip-path:circle(0% at 50% 50%);will-change:clip-path}
.bloom.go .pk{animation:grow .85s cubic-bezier(.5,0,.2,1) forwards}
@keyframes grow{to{clip-path:circle(80% at 50% 50%)}}
.bloom .night{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,#0b1226 0%,#05070f 70%);opacity:0}
.bloom.go .night{animation:fadein .85s ease 1.05s forwards}
@keyframes fadein{to{opacity:1}}
.bloom .hrt{position:absolute;left:50%;top:50%;width:88px;height:88px;margin:-44px 0 0 -44px;fill:#e8456b;opacity:0;filter:drop-shadow(0 8px 20px rgba(232,69,107,.5))}
.bloom.go.wait .hrt{animation:beat .9s ease-in-out infinite!important}
.bloom.go .hrt{animation:hrt 1.5s cubic-bezier(.34,1.56,.64,1) .5s forwards}
@keyframes beat{0%,100%{opacity:1;transform:scale(1)}45%{opacity:1;transform:scale(1.18)}}
@keyframes hrt{0%{opacity:0;transform:scale(.3)}28%{opacity:1;transform:scale(1.15)}48%{transform:scale(1)}68%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1.7)}}
@media (max-width:640px){
  :root{--k:clamp(44px,7.6vh,66px)}
  body{display:block;padding:0;overflow:auto}
  /* tràn viền: khung phủ kín màn hình, không lề, không bo góc */
  .card{width:100%;min-height:100vh;min-height:100dvh;margin:0;border-radius:0;box-shadow:none;grid-template-columns:1fr;grid-template-rows:minmax(110px,28%) 1fr}
  .pic{min-height:0;padding:calc(var(--sat,0px) + 14px) 24px 20px}
  .pic .big{font-size:clamp(60px,11vh,110px)}
  .pic h2{font-size:clamp(1.35rem,3.6vh,1.85rem);margin:4px 0 4px}
  .pic small{font-size:.76rem}
  .pic p{font-size:.86rem}
  .pad{padding:clamp(12px,2.4vh,26px) 20px calc(var(--sab,0px) + clamp(12px,2.4vh,24px));justify-content:space-evenly}
  .logo{width:clamp(40px,6vh,56px);height:clamp(40px,6vh,56px);font-size:clamp(19px,2.9vh,26px)}
  .pad h1{font-size:clamp(1.25rem,3.2vh,1.55rem);margin:clamp(4px,1vh,10px) 0 4px}
  .pad .sub{font-size:.78rem;line-height:1.45}
  .dots{margin:clamp(8px,1.8vh,18px) 0 clamp(4px,1vh,10px);height:28px}
  .msg{margin-bottom:clamp(2px,.8vh,8px)}
  .keys{gap:clamp(8px,1.5vh,14px) 0}
  .hintbtn{margin-top:clamp(6px,1.4vh,14px);padding:9px 22px}
}
@media (prefers-reduced-motion:reduce){
  #rain{display:none}.intro{display:none}
  .keys button,.hintbtn,.sheet,.modal,.msg{transition:none}.hintbtn.nudge{animation:none}
}
</style>
</head>
<body>
<script>/* chỉ bật ẩn-hiện khi có JS và không giảm chuyển động */
if (!matchMedia("(prefers-reduced-motion:reduce)").matches) document.documentElement.classList.add("js-intro");</script>

<canvas id="rain" aria-hidden="true"></canvas>
<canvas id="tapfx" aria-hidden="true"></canvas>

<div class="intro" id="intro" aria-hidden="true">
  <div class="wrap">
    <svg class="ring" viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="46"/><circle class="fg" cx="50" cy="50" r="46"/></svg>
    <svg class="heart" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
  </div>
</div>

<main class="card" id="card">
  <section class="pic rv" id="pic" style="--d:.05s">
    <div class="big" aria-hidden="true">💗</div>
    <small>LOVE</small>
    <h2 id="title"></h2>
    <p id="tag"></p>
  </section>

  <section class="pad">
    <div class="logo rv" style="--d:.12s" aria-hidden="true">❤️</div>
    <h1 class="rv" style="--d:.18s" id="hello"></h1>
    <p class="sub rv" style="--d:.24s" id="sub"></p>
    <div class="dots rv" style="--d:.3s" id="dots" role="status" aria-live="polite" aria-label="Mật mã"></div>
    <div class="msg" id="msg"></div>
    <div class="keys rv" style="--d:.36s" id="keys"></div>
    <button class="hintbtn rv" style="--d:.46s" id="hintBtn" type="button">💡 Gợi ý?</button>
  </section>

</main>


<div class="bloom" id="bloom" aria-hidden="true">
  <div class="pk"></div><div class="night"></div>
  <svg class="hrt" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="hintTitle">
  <div class="sheet">
    <div class="bulb" aria-hidden="true">💡</div>
    <h3 id="hintTitle">Gợi ý</h3>
    <p id="hintBox"></p>
    <button type="button" id="hintOk">Đã hiểu</button>
  </div>
</div>

<script>
/* ===== CẤU HÌNH — chỉ sửa ở đây ===== */
const CONFIG = {
  code: "2011",                 // mật mã (số). Độ dài tự theo mật mã
  hello: "Chào Huuanh",
  sub: "Nhập mật khẩu của chúng ta để bước vào thế giới nhỏ này",
  title: "Gửi tặng Quỳnh",
  tag: "Món quà siêu nhỏ nhỏ",
  hint: "Một ngày đặc biệt của chúng ta (ngày + tháng)",   // ← sửa nội dung gợi ý ở đây
  hintAfterWrong: 2,            // sai bao nhiêu lần thì nút Gợi ý đập nhẹ để gây chú ý (0 = tắt)
  image: "",                    // dán đường dẫn/ảnh (data:...) để thay nền bên trái; để trống = nền hồng
  wrong: "Chưa đúng rồi, thử lại nha",
  nextUrl: "ha.html",          // trang kế tiếp (Ha đang ngủ…)
  music: "music.mp3"            // file nhạc (dùng chung cho cả 3 trang)
};
/* ===================================== */

const $ = (s) => document.querySelector(s);
const still = matchMedia("(prefers-reduced-motion:reduce)").matches;
const N = CONFIG.code.length;
$("#hello").textContent = CONFIG.hello;
$("#sub").textContent = CONFIG.sub;
$("#tag").textContent = CONFIG.tag;
$("#title").innerHTML = CONFIG.title.replace(/</g, "&lt;") + " <i>♥</i>";
$("#hintBox").textContent = CONFIG.hint;
if (CONFIG.image) { const p = $("#pic"); p.style.setProperty("--img", "url('" + CONFIG.image + "')"); p.classList.add("has"); }

const dots = $("#dots"), msg = $("#msg"), keys = $("#keys");
for (let i = 0; i < N; i++) { const d = document.createElement("i"); d.appendChild(document.createElement("b")); dots.appendChild(d); }

/* nút bấm: co nhẹ khi chạm, bật nảy khi nhả (giữ tối thiểu 90ms để thấy rõ) */
function pressable(el, fn, onClick) {
  let t0 = 0, tm = 0;
  const rel = () => { clearTimeout(tm); tm = setTimeout(() => el.classList.remove("p"), Math.max(0, 90 - (Date.now() - t0))); };
  el.addEventListener("pointerdown", (e) => { e.preventDefault(); t0 = Date.now(); clearTimeout(tm); el.classList.add("p"); if (!onClick) fn(); });
  ["pointerup", "pointerleave", "pointercancel"].forEach((ev) => el.addEventListener(ev, rel));
  el.addEventListener("click", (e) => {
    if (onClick) { fn(); return; }                       /* nút đóng: chỉ hành động khi nhả tay */
    if (Date.now() - lastPtr > 700) { el.classList.add("p"); t0 = Date.now(); rel(); fn(); }   /* bàn phím: Enter/Space */
  });
}
let lastPtr = 0; addEventListener("pointerdown", () => { lastPtr = Date.now(); }, true);
["1","2","3","4","5","6","7","8","9","Xóa","0",""].forEach((k) => {
  if (!k) { const sp = document.createElement("span"); sp.className = "sp"; keys.appendChild(sp); return; }
  const b = document.createElement("button"); b.type = "button"; b.textContent = k;
  if (k === "Xóa") { b.className = "ghost"; b.setAttribute("aria-label", "Xóa một số"); }
  pressable(b, () => press(k)); keys.appendChild(b);
});

/* chuyển động chấm */
const EASE = "cubic-bezier(.3,1.7,.5,1)";
function popDot(i) {
  if (still) return; const c = dots.children, d = c[i];
  d.animate([{ transform: "scale(.6)" }, { transform: "scale(1.65)", offset: .4 }, { transform: "scale(1.12)" }], { duration: 380, easing: EASE });
  d.firstChild.animate([{ opacity: .7, transform: "scale(.6)" }, { opacity: 0, transform: "scale(2.2)" }], { duration: 480, easing: "ease-out" });
  [i - 1, i + 1].forEach((j) => { if (c[j]) c[j].animate([{ transform: "translateY(0)" }, { transform: "translateY(-4px)", offset: .35 }, { transform: "translateY(0)" }], { duration: 360, easing: EASE }); });
}
function dropDot(i) {
  if (still) return;
  dots.children[i].animate([{ transform: "scale(1.12)" }, { transform: "scale(.7)", offset: .4 }, { transform: "scale(1)" }], { duration: 300, easing: EASE });
}
addEventListener("message", (e) => { const d = e.data; if (d && d.mmInsets) { const r = document.documentElement.style; r.setProperty("--sat", d.t + "px"); r.setProperty("--sab", d.b + "px"); } });
let val = "", locked = false, wrongN = 0;
function paint(prev) {
  const c = dots.children;
  for (let i = 0; i < c.length; i++) {
    const on = i < val.length, has = c[i].classList.contains("on");
    if (on !== has) { c[i].classList.toggle("on", on); if (on) popDot(i); else if (prev > val.length) dropDot(i); }
  }
}
function press(k) {
  if (locked || Date.now() - closedAt < 350) return;
  const prev = val.length;
  msg.classList.remove("show");
  if (k === "C") val = "";
  else if (k === "Xóa") val = val.slice(0, -1);
  else if (val.length < N) val += k;
  paint(prev);
  if (val.length === N) check();
}
function check() {
  locked = true;
  if (val === CONFIG.code) { success(); return; }
  wrongN++;
  dots.classList.add("bad"); msg.textContent = CONFIG.wrong; msg.classList.add("show");
  if (!still) dots.animate([{ transform: "translateX(0)" }, { transform: "translateX(-10px)", offset: .2 }, { transform: "translateX(9px)", offset: .4 }, { transform: "translateX(-6px)", offset: .6 }, { transform: "translateX(3px)", offset: .8 }, { transform: "translateX(0)" }], { duration: 420, easing: "ease-out" });
  if (navigator.vibrate) try { navigator.vibrate(80); } catch (e) {}
  if (CONFIG.hintAfterWrong && wrongN >= CONFIG.hintAfterWrong) { hintBtn.classList.remove("nudge"); void hintBtn.offsetWidth; hintBtn.classList.add("nudge"); }
  setTimeout(() => { dots.classList.remove("bad"); const p = val.length; val = ""; paint(p); locked = false; }, 480);
}

/* ===== sang trang Ha: tải sẵn ha.html + nhạc, sẵn sàng thì chuyển (màn đêm -> trang Ha cũng nền đêm, liền mạch) ===== */
let nextReady = false, waiting = false;
function warmNext() {
  if (!CONFIG.nextUrl) { nextReady = true; return; }
  fetch(CONFIG.nextUrl).then((r) => r.text()).then(() => { nextReady = true; if (waiting) { waiting = false; goNext(); } }).catch(() => { nextReady = true; if (waiting) { waiting = false; goNext(); } });
}
function revealHa() {
  if (!nextReady) { waiting = true; const b = $("#bloom"); if (b) b.classList.add("wait"); setTimeout(() => { if (waiting) { waiting = false; goNext(); } }, 8000); return; }
  goNext();
}
function barsDark() {      /* thanh trình duyệt: đổi sang màu đêm */
  document.documentElement.style.background = "#05070f"; document.body.style.background = "#05070f";
  const cs = document.querySelector('meta[name="color-scheme"]'); if (cs) cs.setAttribute("content", "dark");
  let tc = document.querySelector('meta[name="theme-color"]');
  if (!tc) { tc = document.createElement("meta"); tc.name = "theme-color"; document.head.appendChild(tc); }
  tc.setAttribute("content", "#05070f");
  void document.documentElement.offsetHeight;
}
let wentNext = false;
function goNext() {
  if (wentNext) return; wentNext = true;
  barsDark(); stop();
  if (CONFIG.nextUrl) { location.replace(CONFIG.nextUrl); setTimeout(() => { location.href = CONFIG.nextUrl; }, 5000); }   /* phòng khi lần chuyển đầu bị kẹt */
}
let unlocked = false;
function success() {
  unlocked = true;
  const card = $("#card");
  if (!still) card.animate([{ transform: "scale(1)" }, { transform: "scale(.965)" }, { transform: "scale(1)" }], { duration: 360, easing: "ease-out" });
  setTimeout(() => { $("#bloom").classList.add("go"); if (!still) { start(); burst(); setTimeout(stop, 1800); } }, 260);
  /* trái tim đã phủ kín và chìm vào màu đêm -> mở Ha ngay bên dưới, liền mạch */
  setTimeout(barsDark, 1300);   /* hồng đã phủ kín: đổi thanh trình duyệt sang đêm */
  setTimeout(revealHa, 2250);
}
addEventListener("keydown", (e) => {
  if (modal.classList.contains("show")) return;
  if (/^[0-9]$/.test(e.key)) press(e.key);
  else if (e.key === "Backspace") press("Xóa");
  else if (e.key === "Escape" || e.key === "Delete") press("C");
});

/* gợi ý: thẻ nhỏ bật lên giữa màn hình */
const modal = $("#modal"), hintBtn = $("#hintBtn"); let closedAt = 0, openedAt = 0;
function showHint(on) {
  if (on === modal.classList.contains("show")) return;
  modal.classList.toggle("show", on);
  if (on) openedAt = Date.now(); else { closedAt = Date.now(); hintBtn.classList.remove("nudge"); }
}
pressable(hintBtn, () => showHint(true));
pressable($("#hintOk"), () => { if (Date.now() - openedAt > 400) showHint(false); }, true);
/* chạm ra ngoài thẻ: đóng khi nhả tay (click), bỏ qua cú click "ma" ngay sau khi vừa mở */
modal.addEventListener("click", (e) => { if (e.target === modal && Date.now() - openedAt > 400) showHint(false); });
addEventListener("keydown", (e) => { if (e.key === "Escape" && modal.classList.contains("show")) showHint(false); });

/* ===== mưa trái tim (nhẹ: vẽ sẵn sprite, ít hạt) ===== */
const cv = $("#rain"), cx = cv.getContext("2d"); let W = 0, H = 0, hs = [], raf = 0, running = false;
const DPR = Math.min(devicePixelRatio || 1, 2);
function size() { W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; cx.setTransform(DPR, 0, 0, DPR, 0, 0); }
addEventListener("resize", size); size();
const rnd = (a, b) => a + Math.random() * (b - a);
const cols = ["#ff5c85", "#ff8fab", "#e8456b", "#ffb3c6"];
const sprites = cols.map((c) => {
  const o = document.createElement("canvas"); o.width = o.height = 32 * DPR; const g = o.getContext("2d"); g.scale(DPR, DPR);
  g.translate(16, 17); g.fillStyle = c; g.beginPath(); const s = 12;
  g.moveTo(0, s * .3); g.bezierCurveTo(-s, -s * .5, -s * .6, -s * 1.1, 0, -s * .5); g.bezierCurveTo(s * .6, -s * 1.1, s, -s * .5, 0, s * .3); g.fill(); return o;
});
const MAX = 14;
function spawn(x, y, burst) {
  hs.push({ x: x ?? rnd(0, W), y: y ?? -20, k: rnd(.4, 1), vy: burst ? rnd(-6, -1) : rnd(.6, 1.6), vx: burst ? rnd(-4, 4) : 0, a: rnd(.4, .8), i: (Math.random() * 4) | 0, ph: rnd(0, 6), b: !!burst });
}
function burst() { for (let i = 0; i < 16; i++) spawn(W / 2, H / 2, true); }
let last = 0;
function loop(t) {
  if (!running) return;
  cx.clearRect(0, 0, W, H);
  if (t - last > 700 && hs.length < MAX) { spawn(); last = t; }
  let n = 0;
  for (let i = 0; i < hs.length; i++) {
    const h = hs[i];
    if (h.b) { h.vy += .12; h.a -= .01; } else h.ph += .02;
    h.x += h.vx + (h.b ? 0 : Math.sin(h.ph) * .35); h.y += h.vy;
    if (h.y > H + 30 || h.a <= .02) continue;
    cx.globalAlpha = h.a; const z = 32 * h.k; cx.drawImage(sprites[h.i], h.x - z / 2, h.y - z / 2, z, z); hs[n++] = h;
  }
  hs.length = n; raf = requestAnimationFrame(loop);
}
function start() { if (running) return; running = true; raf = requestAnimationFrame(loop); }
function stop() { running = false; cancelAnimationFrame(raf); }
document.addEventListener("visibilitychange", () => { if (document.hidden) stop(); else if (!still && !unlocked && introDone) start(); });

/* ===== hiệu ứng chạm: vòng tròn + trái tim tỏa ra, chạm đâu cũng có ===== */
const tcv = $("#tapfx"), tcx = tcv.getContext("2d"); let ps = [], core = [], traf = 0, tprev = 0;
function tsize() { tcv.width = innerWidth * DPR; tcv.height = innerHeight * DPR; tcx.setTransform(DPR, 0, 0, DPR, 0, 0); }
addEventListener("resize", tsize); tsize();
/* sprite riêng cho hiệu ứng chạm: nhiều tông hồng + sao vàng */
function mk(draw) { const o = document.createElement("canvas"); o.width = o.height = 32 * DPR; const g = o.getContext("2d"); g.scale(DPR, DPR); g.translate(16, 16); draw(g); return o; }
const heartFill = (c) => mk((g) => {
  const s = 12; g.fillStyle = c; g.beginPath(); g.moveTo(0, s * .55); g.bezierCurveTo(-s, -s * .25, -s * .6, -s * .85, 0, -s * .25); g.bezierCurveTo(s * .6, -s * .85, s, -s * .25, 0, s * .55); g.fill();
});
const HS = ["#ff4d8d", "#ff6fa5", "#ff8fb8", "#ffa8c8", "#ffc2d8", "#e8456b", "#ff2d7a"].map(heartFill);
const STAR = mk((g) => { g.fillStyle = "#ffd84a"; g.beginPath(); for (let i = 0; i < 8; i++) { const r = i % 2 ? 3 : 11, a = i * Math.PI / 4 - Math.PI / 2; g.lineTo(Math.cos(a) * r, Math.sin(a) * r); } g.closePath(); g.fill(); });
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
addEventListener("pointerdown", (e) => {
  const now = performance.now(), x = e.clientX, y = e.clientY;
  if (ps.length > 220) ps.splice(0, ps.length - 140);
  /* chùm trái tim đủ cỡ bắn tung ra mọi hướng */
  const n = 18;
  for (let i = 0; i < n; i++) {
    const a = rnd(0, 6.283), v = rnd(2.2, 7.5);
    ps.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - rnd(.5, 1.6), r: rnd(-.6, .6), vr: rnd(-.05, .05), k: rnd(.22, .85), sp: HS[(Math.random() * HS.length) | 0], t0: now, life: rnd(950, 1500), ph: rnd(0, 6.28), star: false });
  }
  /* vài ngôi sao vàng lấp lánh */
  for (let i = 0; i < 6; i++) {
    const a = rnd(0, 6.283), v = rnd(1.5, 5);
    ps.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - rnd(.2, 1), r: 0, vr: rnd(-.03, .03), k: rnd(.3, .6), sp: STAR, t0: now, life: rnd(700, 1100), ph: rnd(0, 6.28), star: true });
  }
  core.push({ x, y, t0: now }); if (core.length > 8) core.shift();
  if (!traf) { tprev = now; traf = requestAnimationFrame(tloop); }
}, true);
function tloop(now) {
  const dt = Math.min((now - tprev) / 16.67, 3); tprev = now;
  tcx.clearRect(0, 0, innerWidth, innerHeight);
  /* tim đậm ở tâm điểm chạm: nảy lên rồi tan */
  core = core.filter((c) => now - c.t0 < 600);
  for (const c of core) {
    const t = (now - c.t0) / 600, sc = t < .3 ? .3 + 1.1 * easeOut(t / .3) : 1.4 - .4 * easeOut((t - .3) / .7), z = 34 * sc;
    tcx.globalAlpha = t < .5 ? 1 : 1 - (t - .5) / .5; tcx.drawImage(HS[6], c.x - z / 2, c.y - z / 2, z, z);
  }
  const drag = Math.pow(.93, dt); let n = 0;
  for (let i = 0; i < ps.length; i++) {
    const p = ps[i], t = (now - p.t0) / p.life; if (t >= 1) continue;
    p.vx *= drag; p.vy = p.vy * drag - .02 * dt; p.ph += .05 * dt; p.r += p.vr * dt;
    p.x += (p.vx + Math.sin(p.ph) * .35) * dt; p.y += p.vy * dt;
    let sc = p.k * (t < .12 ? .3 + 5.8 * t : 1 - .25 * (t - .12) / .88);
    if (p.star) sc *= .75 + .35 * Math.sin(p.ph * 3);
    const z = 32 * sc; tcx.globalAlpha = t < .55 ? 1 : 1 - (t - .55) / .45;
    if (p.r) { tcx.save(); tcx.translate(p.x, p.y); tcx.rotate(p.r); tcx.drawImage(p.sp, -z / 2, -z / 2, z, z); tcx.restore(); }
    else tcx.drawImage(p.sp, p.x - z / 2, p.y - z / 2, z, z);
    ps[n++] = p;
  }
  ps.length = n; tcx.globalAlpha = 1;
  if (ps.length || core.length) traf = requestAnimationFrame(tloop); else { traf = 0; tcx.clearRect(0, 0, innerWidth, innerHeight); }
}

/* ===== màn mở đầu -> khung nhập mật mã ===== */
let introDone = false;
function enter() { introDone = true; $("#card").classList.add("in"); if (!still) start(); }
if (still) { introDone = true; }
else {
  setTimeout(() => $("#intro").classList.add("leave"), 1050);   /* trái tim thu nhỏ, nền mờ dần */
  setTimeout(enter, 1300);                                       /* khung bật vào kiểu iOS */
  setTimeout(() => $("#intro").remove(), 2100);
}
setTimeout(warmNext, still ? 300 : 1900);                        /* khung hiện xong mới tải trước trang sau */
</script>
</body>
</html>
