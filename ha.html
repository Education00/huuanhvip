<style>
/* Bố cục: sân khấu toàn màn hình tối (nền chuyển cảnh, hạt, trang trí, Ha ở giữa, lời thoại, khu tương tác), sau đó gian hàng cuộn bình thường. */
:root {
  --bg: #05070f; --ink: #e9fdff; --muted: #8fb1c4; --cy: #35f3ff; --cy2: #8ff9ff;
  --pink: #ff6fb1; --green: #4dff9a; --gold: #ffd66b; --violet: #9b7bff;
  --panel: rgba(12, 22, 48, 0.74); --line: rgba(120, 200, 255, 0.24);

  --disp: "Baloo 2", "Be Vietnam Pro", system-ui, sans-serif;
  --body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --e: clamp(52px, 15vmin, 96px);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0; overflow-x: hidden;
}
html.story, html.story body { height: 100%; overflow: hidden; }
html.hascur, html.hascur * { cursor: none !important; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--cy); outline-offset: 3px; border-radius: 10px; }

/* ---------- Sân khấu ---------- */
#stage { position: fixed; inset: 0; z-index: 5; overflow: hidden; background: var(--bg); }
.bgs, .bgs .bg { position: absolute; inset: 0; }
.bg { opacity: 0; transition: opacity 1.4s ease; }
.bg.on { opacity: 1; }
.bg[data-b="night"] { background: radial-gradient(ellipse at 50% 40%, #0b1226 0%, #05070f 70%); }
.bg[data-b="pink"] { background: radial-gradient(ellipse at 50% 110%, #7a3a1a 0%, transparent 45%), linear-gradient(180deg, #2a0b3a 0%, #5a1456 55%, #05070f 100%); }
.bg[data-b="field"] { background: linear-gradient(180deg, #02131f 0%, #04334a 60%, #06223a 100%); }
.bg[data-b="stars"] { background: radial-gradient(ellipse at 50% 100%, #3b1670 0%, transparent 60%), linear-gradient(180deg, #0a0820 0%, #2a0f4d 100%); }
.bg[data-b="green"] { background: radial-gradient(ellipse at 72% 55%, #0f7a3a 0%, #063a1e 55%, #02100a 100%); }
.bg[data-b="blue"] { background: radial-gradient(ellipse at 50% 30%, #123a8a 0%, #07163c 55%, #03061a 100%); }
.bg[data-b="plane"] { background: linear-gradient(180deg, #050a22 0%, #0b1a4d 100%); }
.bg[data-b="planet"] { background: radial-gradient(ellipse at 80% 30%, #5a1f8a 0%, transparent 55%), linear-gradient(180deg, #060a2a 0%, #1a2a7a 100%); }
#fx, #grass { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#deco { position: absolute; inset: 0; pointer-events: none; }
#deco > * { pointer-events: auto; }

.col {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  padding: max(56px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(28px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  text-align: center; pointer-events: none;
}
.col > * { pointer-events: auto; }

/* ---------- Ha ---------- */
#bot { position: relative; transition: transform 0.35s cubic-bezier(0.2, 1.4, 0.4, 1), opacity 0.9s ease; transform: translate(calc(var(--lx, 0) * 10px), calc(var(--ly, 0) * 7px)); }
#bot.hide { opacity: 0; transform: scale(0.6); pointer-events: none; }

.eye:nth-child(2) { animation-delay: 0.04s; }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.08); } }
.sq { position: absolute; inset: 0; border-radius: 30%; background: radial-gradient(circle at 40% 35%, #b8ffff, var(--cy) 70%); box-shadow: 0 0 28px 6px rgba(53, 243, 255, 0.55), 0 0 70px 8px rgba(53, 243, 255, 0.22); transition: opacity 0.25s, transform 0.3s cubic-bezier(0.2, 1.6, 0.4, 1), border-radius 0.3s; animation: glow 3.4s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 0 40px 10px rgba(53, 243, 255, 0.7), 0 0 84px 12px rgba(53, 243, 255, 0.3); } }
.gl { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--mono); font-weight: 800; font-size: calc(var(--e) * 1.05); color: var(--cy); text-shadow: 0 0 16px var(--cy), 0 0 40px rgba(53, 243, 255, 0.6); opacity: 0; transition: opacity 0.25s; line-height: 1; }
.m-happy .sq { transform: scaleY(0.3) translateY(-30%); border-radius: 60% 60% 18% 18% / 100% 100% 24% 24%; }
.m-happy .eye { animation: none; }
.m-excited .sq, .m-excited .eye { opacity: 0; animation: none; }
.m-excited .gl { opacity: 1; }
.m-hide .eye { opacity: 0; }
.eye { transition: opacity 0.9s ease; }
.blush { position: absolute; left: 50%; bottom: -26px; transform: translateX(-50%); font-family: var(--mono); letter-spacing: 3px; color: var(--pink); font-size: 14px; text-shadow: 0 0 10px var(--pink); opacity: 0; transition: opacity 0.5s; }
.blushing .blush { opacity: 1; }
#bot.poke .botin { animation: poke 0.45s cubic-bezier(0.2, 1.8, 0.4, 1); }
@keyframes poke { 30% { transform: scale(0.82, 1.14); } 65% { transform: scale(1.1, 0.9); } }

/* ---------- Lời thoại ---------- */
#line { font-family: var(--mono); font-weight: 500; font-size: clamp(1rem, 3.7vw, 1.5rem); line-height: 1.5; color: var(--ink); text-shadow: 0 0 12px rgba(53, 243, 255, 0.65); width: min(94vw, 660px); min-height: 3.3em; text-wrap: balance; }
#line .hl { color: var(--green); text-shadow: 0 0 14px rgba(77, 255, 154, 0.8); font-weight: 800; }
#line .hp { color: var(--pink); text-shadow: 0 0 14px rgba(255, 111, 177, 0.8); font-weight: 800; }
#line .cr::after { content: ""; display: inline-block; width: 0.55em; height: 1.05em; margin-left: 3px; background: var(--cy); vertical-align: text-bottom; animation: caret 0.8s steps(1) infinite; }

/* ---------- Khu tương tác ---------- */
#act { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: center; min-height: 54px; position: relative; width: min(94vw, 640px); }
.btn {
  appearance: none; border: 2px solid var(--cy); background: rgba(53, 243, 255, 0.1); color: var(--cy2);
  font-family: var(--mono); font-weight: 600; font-size: 1rem; padding: 12px 22px; border-radius: 999px; cursor: pointer;
  text-shadow: 0 0 10px rgba(53, 243, 255, 0.7); box-shadow: 0 0 22px rgba(53, 243, 255, 0.25);
  transition: transform 0.25s cubic-bezier(0.2, 1.6, 0.4, 1), background 0.2s, box-shadow 0.2s; animation: popin 0.6s cubic-bezier(0.2, 1.6, 0.4, 1) both;
}
.btn:hover { transform: translateY(-3px) scale(1.06); background: rgba(53, 243, 255, 0.22); box-shadow: 0 0 34px rgba(53, 243, 255, 0.5); }
.btn:active { transform: scale(0.95); }
.btn.pink { border-color: var(--pink); color: #ffd3e8; background: rgba(255, 111, 177, 0.12); text-shadow: 0 0 10px rgba(255, 111, 177, 0.7); box-shadow: 0 0 22px rgba(255, 111, 177, 0.25); }
.btn.solid { background: var(--cy); color: #021018; text-shadow: none; }
@keyframes popin { from { opacity: 0; transform: scale(0.6) translateY(14px); } }
.counter { font-family: var(--mono); color: var(--muted); font-size: 0.95rem; }
.hint { font-family: var(--mono); font-size: 0.85rem; color: var(--muted); animation: hintb 2.4s ease-in-out infinite; }
@keyframes hintb { 50% { opacity: 0.4; } }

/* ---------- Thanh điều khiển ---------- */
.hud { position: absolute; inset: 0; pointer-events: none; z-index: 6; padding: max(14px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); }
.hud > * { pointer-events: auto; }
.dots { position: absolute; top: max(16px, env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
.dots i { width: 7px; height: 7px; border-radius: 99px; background: rgba(255, 255, 255, 0.2); transition: width 0.4s cubic-bezier(0.2, 1.4, 0.4, 1), background 0.3s; }
.dots i.on { background: var(--cy); box-shadow: 0 0 8px var(--cy); }

.music { position: absolute; top: max(10px, env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 8px; background: rgba(8, 16, 36, 0.7); border: 1.5px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; font-size: 0.85rem; font-weight: 600; color: var(--cy2); }
.eq { display: flex; align-items: flex-end; gap: 3px; height: 16px; }

.music.on .eq i { animation: eq 0.85s ease-in-out infinite; }
.music.on .eq i:nth-child(2) { animation-delay: -0.3s; } .music.on .eq i:nth-child(3) { animation-delay: -0.6s; } .music.on .eq i:nth-child(4) { animation-delay: -0.15s; }
@keyframes eq { 50% { height: 16px; } }
.skip { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); background: none; border: 0; color: var(--muted); font-family: var(--mono); font-size: 0.8rem; cursor: pointer; padding: 8px; opacity: 0; transition: opacity 0.6s; }
.skip.show { opacity: 0.8; }

/* ---------- Sticker, con trỏ ---------- */
.stk { position: fixed; left: 0; top: 0; width: 44px; height: 44px; z-index: 30; pointer-events: none; will-change: transform, opacity; animation: stk 1.5s cubic-bezier(0.2, 0.8, 0.3, 1) forwards; }
.stk svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.35)); }
@keyframes stk { 0% { opacity: 0; transform: translate(var(--x), var(--y)) scale(0.2) rotate(var(--r0)); } 18% { opacity: 1; transform: translate(var(--x), calc(var(--y) - 16px)) scale(1.15) rotate(var(--r1)); } 100% { opacity: 0; transform: translate(calc(var(--x) + var(--dx)), calc(var(--y) - 110px)) scale(0.9) rotate(var(--r2)); } }
#cur { position: fixed; left: 0; top: 0; width: 30px; height: 30px; z-index: 60; pointer-events: none; will-change: transform; opacity: 0; transition: opacity 0.3s; }
#cur.vis { opacity: 1; }
#cur svg { width: 100%; height: 100%; overflow: visible; transition: transform 0.25s cubic-bezier(0.2, 1.7, 0.4, 1); filter: drop-shadow(0 0 7px rgba(255, 214, 107, 0.9)); }

#cur.over svg { transform: scale(1.45) rotate(-8deg); } #cur.down svg { transform: scale(0.8); }

/* ---------- Cảnh: trang trí ---------- */
.heartbub { position: absolute; width: 46px; height: 46px; border: 0; background: none; padding: 0; cursor: pointer; animation: hbob 3.2s ease-in-out infinite; }
.heartbub svg { width: 100%; height: 100%; filter: drop-shadow(0 0 10px rgba(255, 111, 177, 0.9)); transition: transform 0.2s; }
.heartbub:hover svg { transform: scale(1.25); }
@keyframes hbob { 50% { transform: translateY(-14px) rotate(6deg); } }
.heartbub.pop { animation: hpop 0.4s ease-out forwards; }
@keyframes hpop { to { transform: scale(1.8); opacity: 0; } }
.star-b { position: absolute; width: 54px; height: 54px; border: 0; background: none; padding: 0; cursor: pointer; transform: translate(-50%, -50%); animation: tw 2.6s ease-in-out infinite; }
.star-b svg { width: 100%; height: 100%; filter: drop-shadow(0 0 8px rgba(255, 214, 107, 0.7)); opacity: 0.55; transition: opacity 0.3s, transform 0.4s cubic-bezier(0.2, 1.6, 0.4, 1); }
.star-b:hover svg { transform: scale(1.2); opacity: 0.9; }

@keyframes tw { 50% { scale: 1.12; } }
#cons { position: absolute; inset: 0; width: 100%; height: 100%; }
#cons line { stroke: rgba(255, 214, 107, 0.7); stroke-width: 2; stroke-dasharray: 600; stroke-dashoffset: 600; transition: stroke-dashoffset 1s ease; }
#cons line.on { stroke-dashoffset: 0; }
.clover { position: absolute; right: max(4vw, 20px); bottom: 12%; width: clamp(130px, 28vmin, 240px); border: 0; background: none; padding: 0; cursor: pointer; transform-origin: 50% 100%; animation: csway 4s ease-in-out infinite; }
.clover svg { width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 0 16px rgba(77, 255, 154, 0.9)); }
@keyframes csway { 50% { transform: rotate(4deg); } }
.clover.gone { animation: cgo 1.2s cubic-bezier(0.5, 0, 0.3, 1) forwards; }
@keyframes cgo { to { transform: translate(-48vw, -26vh) rotate(-30deg) scale(0.35); opacity: 0; } }
.ring { position: absolute; inset: -14px; width: calc(100% + 28px); height: calc(100% + 28px); transform: rotate(-90deg); pointer-events: none; }
.ring circle { fill: none; stroke: var(--green); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 289; stroke-dashoffset: 289; filter: drop-shadow(0 0 6px var(--green)); }
.plane-wrap { position: absolute; left: 0; right: 0; bottom: 14%; height: 140px; }
.card-ph { position: absolute; left: max(8vw, 24px); bottom: 10px; width: 108px; height: 76px; border-radius: 12px; border: 2px solid rgba(143, 249, 255, 0.5); background: linear-gradient(180deg, #ffd66b, #ff6fb1); box-shadow: 0 0 24px rgba(255, 111, 177, 0.4); }
.plane { position: absolute; right: max(8vw, 24px); bottom: 14px; width: 120px; transition: transform 2.4s cubic-bezier(0.5, 0, 0.2, 1), opacity 0.6s; filter: drop-shadow(0 0 8px rgba(143, 249, 255, 0.7)); animation: pbob 3s ease-in-out infinite; }

@keyframes dash { to { stroke-dashoffset: -32; } }

.rover svg { width: 100%; height: auto; overflow: visible; }
.rover.hop svg { animation: rhop 0.5s cubic-bezier(0.2, 1.6, 0.4, 1); }
@keyframes rhop { 40% { transform: translateY(-26px) rotate(-6deg); } }
.planet { position: absolute; left: -10%; right: -10%; bottom: -34%; height: 56%; border-radius: 50%; background: radial-gradient(ellipse at 50% 0%, #4a86c8 0%, #1d4a86 40%, #0b1f4a 100%); box-shadow: 0 -8px 40px rgba(110, 170, 255, 0.5); }
.dodge { position: relative; transition: transform 0.35s cubic-bezier(0.2, 1.5, 0.4, 1); }

/* ---------- Gian hàng ---------- */
#shop { position: relative; z-index: 2; max-width: 1040px; margin: 0 auto; padding-block: 28px 80px; }
.shop-bg { position: fixed; inset: 0; z-index: 0; background: radial-gradient(ellipse at 50% 0%, #14246a 0%, #070c26 60%, #03050f 100%); }

.flags i:nth-child(3n) { animation-delay: -1s; } .flags i:nth-child(3n+1) { animation-delay: -2s; }
@keyframes flagw { 50% { transform: skewX(4deg) scaleY(1.05); } }
.panel h3 { font-family: var(--disp); font-weight: 800; font-size: 1.35rem; text-align: center; }

.cell { opacity: 0; transform: translateY(26px) scale(0.95); transition: opacity 0.6s ease, transform 0.7s cubic-bezier(0.2, 1.2, 0.4, 1); transition-delay: var(--d, 0s); }

.item:hover { border-color: var(--cy); box-shadow: 0 0 26px rgba(53, 243, 255, 0.35); }
.art { aspect-ratio: 4 / 3; display: grid; place-items: center; background: var(--tint, #f9c9dc); position: relative; overflow: hidden; --ink: #2a1840; --petal: #f58fb5; --face: #ffe3b8; --accent: #d63a78; --leaf: #2c8a68; --card: #fff8fb; --line: #ecc3d6; }
.art svg { width: 76%; height: auto; max-height: 86%; transition: transform 0.5s cubic-bezier(0.2, 1.5, 0.4, 1); }

.info { padding: 10px 12px 12px; display: grid; gap: 2px; }

  for (let i = 0; i < nH; i++) { const m = new THREE.Mesh(heartGeo, heartMat); put(m, 0.65, 1.15); items.push({ mesh: m, speed: 0.3 + Math.random() * 0.45 }); }
